name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: comandflow
          POSTGRES_USER: comandflow
          POSTGRES_PASSWORD: comandflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comandflow -d comandflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_SECRET_KEY: cle-de-test-ci
      DATABASE_URL: postgres://comandflow:comandflow@localhost:5432/comandflow
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Syntaxe des fichiers YAML
        run: |
          pip install pyyaml
          python -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" docker-compose.yml .pre-commit-config.yaml .github/workflows/ci.yml
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
