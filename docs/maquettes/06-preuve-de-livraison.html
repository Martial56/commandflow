<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preuve de livraison</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#172554}
</style>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F6F4EF; color: #1C1B19; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="background: #1C1B19; color: #F6F4EF; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; color: #C9C5BC">Arrêt 6 sur 8 · CMD-2026-001284</div>
    <h1 style="margin: 0; font-size: 22px; font-weight: 600">Restaurant Le Baobab</h1>
    <a href="#" style="color: #BFDBFE; font-size: 14px; min-height: 32px; display: inline-flex; align-items: center">Ouvrir l'itinéraire</a>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1">
    <fieldset style="margin: 0; border: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0 0 8px">Résultat</legend>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; background: #DBEAFE; border: 2px solid #1E3A8A; border-radius: 8px; font-weight: 600">
        <input type="radio" name="res" checked=""> Livrée
      </label>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; background: #FFFFFF; border: 1px solid #B8B3A8; border-radius: 8px">
        <input type="radio" name="res"> Partielle
      </label>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; background: #FFFFFF; border: 1px solid #B8B3A8; border-radius: 8px">
        <input type="radio" name="res"> Refusée
      </label>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; background: #FFFFFF; border: 1px solid #B8B3A8; border-radius: 8px">
        <input type="radio" name="res"> Client absent
      </label>
    </fieldset>

    <div style="background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 92px; gap: 8px; font-size: 12px; color: #5E5A52; padding-bottom: 6px; border-bottom: 1px solid #EFECE6">
        <span>Produit</span><span style="text-align: right">Prévu</span><span style="text-align: right">Livré</span>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 92px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #EFECE6">
        <label for="l1">Pain baguette</label>
        <span style="text-align: right; font-family: 'IBM Plex Mono', monospace">120</span>
        <input id="l1" inputmode="numeric" value="120" style="height: 44px; width: 100%; box-sizing: border-box; text-align: right; padding: 0 10px; border: 1px solid #B8B3A8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 92px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #EFECE6">
        <label for="l2">Croissant</label>
        <span style="text-align: right; font-family: 'IBM Plex Mono', monospace">40</span>
        <input id="l2" inputmode="numeric" value="40" style="height: 44px; width: 100%; box-sizing: border-box; text-align: right; padding: 0 10px; border: 1px solid #B8B3A8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 92px; gap: 8px; align-items: center; padding: 8px 0">
        <label for="l3">Pain de mie</label>
        <span style="text-align: right; font-family: 'IBM Plex Mono', monospace">15</span>
        <input id="l3" inputmode="numeric" value="15" style="height: 44px; width: 100%; box-sizing: border-box; text-align: right; padding: 0 10px; border: 1px solid #B8B3A8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 600">Preuve de livraison</h2>
      <button style="min-height: 72px; border: 1px dashed #1E3A8A; background: #F5F8FF; color: #1E3A8A; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer">Photographier le bordereau signé</button>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="recep" style="font-size: 13px; font-weight: 500">Nom du réceptionnaire</label>
        <input id="recep" value="Mme Touré" style="height: 44px; padding: 0 12px; border: 1px solid #B8B3A8; border-radius: 8px; font: inherit">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="bord" style="font-size: 13px; font-weight: 500">N° de bordereau (optionnel)</label>
        <input id="bord" value="" style="height: 44px; padding: 0 12px; border: 1px solid #B8B3A8; border-radius: 8px; font: inherit">
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border: 1px solid #B8B3A8; background: #FFFFFF; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer">Signature</button>
        <button style="flex: 1; height: 44px; border: 1px solid #B8B3A8; background: #FFFFFF; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer">Code client</button>
      </div>
      <div style="font-size: 12px; color: #5E5A52">Heure et position enregistrées automatiquement à la validation.</div>
    </div>

    <button style="margin-top: auto; height: 56px; border: none; background: #1E3A8A; color: #FFFFFF; border-radius: 8px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Valider la livraison</button>
  </div>
</div>
</body>
</html>
