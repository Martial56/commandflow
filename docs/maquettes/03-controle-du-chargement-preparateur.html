<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrôle du chargement par le préparateur</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#172554}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EF; color: #1C1B19; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="background: #1C1B19; color: #F6F4EF; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; color: #C9C5BC">Préparation · TRN-0187 · Konan K.</div>
    <h1 style="margin: 0; font-size: 22px; font-weight: 600">Arrêt 7 · Supérette Les Palmiers</h1>
    <div style="font-size: 13px; color: #DDD9D0">CMD-2026-001291 · 3 produits</div>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1">
    <p style="margin: 0; font-size: 14px; color: #3D3A34">Comptez chaque produit chargé dans le véhicule et cochez la ligne.</p>

    <div style="background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600"><input type="checkbox" checked style="width: 22px; height: 22px"> Pain baguette</label><span style="font-size: 13px; color: #166534; font-weight: 600">Conforme</span></div>
      <div style="display: flex; gap: 12px; align-items: center; font-size: 14px"><span style="color: #5E5A52">Attendu</span><span style="font-family: 'IBM Plex Mono', monospace">100</span><label for="p1" style="margin-left: auto; color: #5E5A52">Préparé</label><input id="p1" inputmode="numeric" value="100" style="width: 84px; height: 44px; text-align: right; padding: 0 10px; border: 1px solid #B8B3A8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 16px"></div>
    </div>

    <div style="background: #FFF7ED; border: 2px solid #C2410C; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600"><input type="checkbox" checked style="width: 22px; height: 22px"> Croissant</label><span style="font-size: 13px; color: #9A3412; font-weight: 600">Écart −30</span></div>
      <div style="display: flex; gap: 12px; align-items: center; font-size: 14px"><span style="color: #5E5A52">Attendu</span><span style="font-family: 'IBM Plex Mono', monospace">60</span><label for="p2" style="margin-left: auto; color: #5E5A52">Préparé</label><input id="p2" inputmode="numeric" value="30" style="width: 84px; height: 44px; text-align: right; padding: 0 10px; border: 2px solid #C2410C; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 16px"></div>
      <label for="motif" style="font-size: 13px; font-weight: 500">Motif de l'écart</label>
      <select id="motif" style="height: 44px; padding: 0 10px; border: 1px solid #B8B3A8; border-radius: 8px; font: inherit; background: #FFFFFF"><option>Production insuffisante</option><option>Produit abîmé</option><option>Autre</option></select>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600"><input type="checkbox" style="width: 22px; height: 22px"> Pain de mie</label><span style="font-size: 13px; color: #5E5A52">À compter</span></div>
      <div style="display: flex; gap: 12px; align-items: center; font-size: 14px"><span style="color: #5E5A52">Attendu</span><span style="font-family: 'IBM Plex Mono', monospace">20</span><label for="p3" style="margin-left: auto; color: #5E5A52">Préparé</label><input id="p3" inputmode="numeric" value="" style="width: 84px; height: 44px; text-align: right; padding: 0 10px; border: 1px solid #B8B3A8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 16px"></div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <button style="height: 56px; border: none; background: #C2410C; color: #FFFFFF; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Signaler l'écart au gestionnaire</button>
      <span style="font-size: 12px; color: #5E5A52; text-align: center">Le chauffeur confirmera lui-même la réception depuis son compte.</span>
    </div>
  </div>
</div>
</body>
</html>
