services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: comandflow
      POSTGRES_USER: comandflow
      POSTGRES_PASSWORD: comandflow
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comandflow -d comandflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Serveur de développement + recompilation du CSS Tailwind à chaque modification.
    command: python manage.py tailwind runserver 0.0.0.0:8000
    # La surveillance de Tailwind s'arrête si l'entrée standard se ferme.
    stdin_open: true
    env_file: .env
    ports:
      - "${PORT_WEB:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Tâches de fond (Celery).
  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Tâches planifiées (Celery Beat) ; fichier d'état hors du dossier du projet.
  beat:
    build: .
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  donnees_postgres:
