<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComandFlow</title>
</head>
<body>
  <h1>ComandFlow</h1>
  <p>Connecté : {{ user }} — {{ user.get_role_principal_display|default:"aucun rôle" }}
    {% if user.entreprise %}· {{ user.entreprise }}{% endif %}</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit">Se déconnecter</button>
  </form>
</body>
</html>
