repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # docs/ exclu : les doubles espaces en fin de ligne sont des retours à la ligne Markdown.
      # static/vendor/ exclu : bibliothèques copiées telles quelles, jamais modifiées.
      - id: trailing-whitespace
        exclude: ^(docs|static/vendor)/
      - id: end-of-file-fixer
        exclude: ^(docs|static/vendor)/
      # check-yaml retiré : bloqué par le contrôle des applications de Windows
      # (WinError 4551). La syntaxe des fichiers YAML est vérifiée par la CI.
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
